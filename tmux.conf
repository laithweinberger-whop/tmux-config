source-file -q ~/.smux/tmux.conf
set -g mouse on

# Always show a title bar on every pane's border (not just the active one)
set -g pane-border-status top

# Title bar text: show the pane's reported title (set via OSC escape sequence
# by the program running in it, e.g. Claude Code / Codex), falling back to
# the current command name if nothing has set a title yet.
set -g pane-border-format "#{?pane_title,#{pane_title},#{pane_current_command}}"

set -g pane-border-style 'fg=#{?#{||:#{==:#{pane_id},#{@swap_sel_1}},#{==:#{pane_id},#{@swap_sel_2}}},yellow,red}'
set -g pane-active-border-style 'fg=#{?#{||:#{==:#{pane_id},#{@swap_sel_1}},#{==:#{pane_id},#{@swap_sel_2}}},yellow,blue}'

# Use single-line borders (default, explicit for clarity)
set -g pane-border-lines single

# ---- Session persistence (tmux-resurrect / tmux-continuum) ----
set -g @resurrect-processes '"cod" "cla" "claude->cla --resume" "codex->cod resume --no-daemon"'
set -g @resurrect-hook-post-save-layout 'python3 "$HOME/.tmux/scripts/agent-sessions.py" save'
set -g @resurrect-delete-backup-after '7'
set -g @resurrect-capture-pane-contents 'on'

# Auto-restore the last saved session when tmux starts fresh (e.g. after
# a reboot). tmux-continuum's own autosave only has minute granularity,
# so it's kept as a slow safety-net save; the real ~30s cadence comes
# from the custom loop below.
set -g @continuum-restore 'on'
set -g @continuum-save-interval '1'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Tight ~30s autosave loop (survives config reloads via its own lockfile)
run-shell -b '~/.tmux/scripts/autosave-loop.sh'

# Manual save: Option+s (no prefix needed), fully silent. Requires your
# terminal to send Option as Meta (Esc+key) for this to reach tmux as M-s.
bind-key -n M-s run-shell -b '~/.tmux/scripts/save-silent.sh'

set -g @grid_layout '#{E:##{@grid_layout_#{window_width}x#{window_height}_#{window_panes}#}}'
set -g @grid_reflow 'if-shell -F "#{!=:#{E:@grid_layout},}" { select-layout -t "#{window_id}" "#{E:@grid_layout}" } { run-shell -b "~/.tmux/scripts/reflow-grid.sh #{window_id} #{window_width} #{window_height} #{window_panes}" }'
set -g @grid_split 'split-window -#{?#{==:#{e|%:#{window_panes},2},0},v,h} -t "#{window_id}.#{e|+:#{pane-base-index},#{e|-:#{window_panes},#{?#{==:#{e|%:#{window_panes},2},0},2,1}}}"'
bind-key % run-shell -C '#{E:@grid_split}'
bind-key '"' run-shell -C '#{E:@grid_split}'
bind-key -n M-n run-shell -C '#{E:@grid_split}'
bind-key -n M-w kill-pane
bind-key -n M-- run-shell 'python3 ~/.tmux/scripts/minimize-pane.py #{q:socket_path} #{q:session_id} #{q:pane_id}'
bind-key -n M-l run-shell -C '#{E:@grid_reflow}'
run-shell -b '~/.tmux/scripts/reflow-grid.sh --cache-all'

# Option+click a pane to view/edit a free-text description of what it's
# doing, via a native macOS dialog (real Cocoa text field -- reliable
# cursor movement, copy/paste, etc, no custom terminal-input code to
# maintain). Pre-filled with the existing description if there is one
# (empty otherwise), so the same action serves as both "write a new one"
# and "read/edit the existing one". Stored as a per-pane option, so it
# persists across reflows, resizes, and session save/restore.
bind-key -n M-MouseDown1Pane run-shell -b "~/.tmux/scripts/pane-desc-native.sh '#{pane_id}'"

set -g @swap_select {
    if-shell -F -t = '#{==:#{pane_id},#{@swap_sel_1}}' {
        set-option -gu @swap_sel_1
    } {
        if-shell -F -t = '#{==:#{pane_id},#{@swap_sel_2}}' {
            set-option -gu @swap_sel_2
        } {
            if-shell -F '#{!:#{@swap_sel_1}}' {
                set-option -gF -t = @swap_sel_1 '#{pane_id}'
            } {
                if-shell -F '#{!:#{@swap_sel_2}}' {
                    set-option -gF -t = @swap_sel_2 '#{pane_id}'
                } {
                    set-option -gu @swap_sel_2
                    set-option -gF -t = @swap_sel_1 '#{pane_id}'
                }
            }
        }
    }
    refresh-client
}
bind-key -n S-MouseDown1Pane run-shell -C -t = '#{E:@swap_select}'
bind-key -n S-SecondClick1Pane run-shell -C -t = '#{E:@swap_select}'
bind-key -n S-TripleClick1Pane run-shell -C -t = '#{E:@swap_select}'
bind-key -n S-DoubleClick1Pane {}
bind-key -n M-x {
    if-shell -F '#{&&:#{@swap_sel_1},#{@swap_sel_2}}' {
        run-shell -C 'swap-pane -s "#{@swap_sel_1}" -t "#{@swap_sel_2}"'
    }
    set-option -gu @swap_sel_1
    set-option -gu @swap_sel_2
    refresh-client
}
bind-key -n MouseDown1Pane {
    select-pane -t =
    send-keys -M
    if-shell -F '#{||:#{@swap_sel_1},#{@swap_sel_2}}' {
        set-option -gu @swap_sel_1
        set-option -gu @swap_sel_2
        refresh-client
    }
}

# after-kill-pane loses the destroyed pane's target; hook_window survives it.
set-hook -gu after-kill-pane
set-hook -gu pane-exited
set-hook -g after-split-window {
    set-option -wF @grid_panes '#{window_panes}'
    run-shell -C '#{E:@grid_reflow}'
}
set-hook -g window-layout-changed {
    run-shell -C 'if-shell -F -t "#{hook_window}" "##{!=:##{window_panes},##{@grid_panes}}" { set-option -wF -t "#{hook_window}" @grid_panes "##{window_panes}" ; run-shell -C -t "#{hook_window}" "##{E:@grid_reflow}" }'
}

# Disable copy-mode character jumps (f/F/t/T and their repeat keys). Typing
# while scrolled back would otherwise leave a stuck "(jump to forward)"
# prompt at the bottom of the window.
unbind-key -T copy-mode f
unbind-key -T copy-mode F
unbind-key -T copy-mode t
unbind-key -T copy-mode T
unbind-key -T copy-mode \;
unbind-key -T copy-mode ,
unbind-key -T copy-mode-vi f
unbind-key -T copy-mode-vi F
unbind-key -T copy-mode-vi t
unbind-key -T copy-mode-vi T
unbind-key -T copy-mode-vi \;
unbind-key -T copy-mode-vi ,

# Initialize TPM (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
