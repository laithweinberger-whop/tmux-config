# Always show a title bar on every pane's border (not just the active one)
set -g pane-border-status top

# Title bar text: show the pane's reported title (set via OSC escape sequence
# by the program running in it, e.g. Claude Code / Codex), falling back to
# the current command name if nothing has set a title yet.
set -g pane-border-format "#{?pane_title,#{pane_title},#{pane_current_command}}"

# Dividing line / border colors: red when a pane is NOT focused, blue
# when it IS focused, yellow when shift-click-selected for a swap --
# selected takes priority over focused so both selected panes always
# show the SAME color regardless of which one happens to be focused
# (tmux's own pane mark only tracks one pane at a time, so selection
# state for the swap feature is tracked separately per-pane via
# @swap_selected and reflected here as a live conditional style).
set -g pane-border-style 'fg=#{?@swap_selected,yellow,red}'
set -g pane-active-border-style 'fg=#{?@swap_selected,yellow,blue}'

# Use single-line borders (default, explicit for clarity)
set -g pane-border-lines single

# ---- Session persistence (tmux-resurrect / tmux-continuum) ----
# Restore claude/codex panes by resuming their most recent conversation
# in that pane's working directory, instead of just replaying the bare
# launch command (which would start a brand new chat).
set -g @resurrect-processes '"claude->claude --continue" "codex->codex resume --last"'
set -g @resurrect-capture-pane-contents 'on'

# Auto-restore the last saved session when tmux starts fresh (e.g. after
# a reboot). tmux-continuum's own autosave only has minute granularity,
# so it's kept as a slow safety-net save; the real ~30s cadence comes
# from the custom loop below.
set -g @continuum-restore 'on'
set -g @continuum-save-interval '1'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Tight ~30s autosave loop (survives config reloads via its own lockfile)
run-shell -b '~/.tmux/scripts/autosave-loop.sh'

# Manual save: Option+s (no prefix needed), fully silent. Requires your
# terminal to send Option as Meta (Esc+key) for this to reach tmux as M-s.
bind-key -n M-s run-shell '~/.tmux/scripts/save-silent.sh'

# ---- Auto-growing 2-row pane grid ----
# New panes are laid out in a grid capped at 2 rows, growing columns to
# the right, filled column-major (fill a column's top+bottom before
# starting a new column). Bound to the normal split keys so muscle memory
# still works.
bind-key % run-shell '~/.tmux/scripts/grid-split.sh "#{window_id}"'
bind-key '"' run-shell '~/.tmux/scripts/grid-split.sh "#{window_id}"'

# tmux ships a factory binding on Option+n (no prefix) that opens a new
# pane via its own uncapped "tiled" layout (rows scale with sqrt(panes),
# not capped at 2). Point it at the same grid script instead.
bind-key -n M-n run-shell '~/.tmux/scripts/grid-split.sh "#{window_id}"'

# Manual re-tile: Option+l rebuilds the current window's panes back into
# the capped grid (fixes drift from manual resizing), without disturbing
# any running programs -- panes are re-parented, never killed/recreated.
bind-key -n M-l run-shell '~/.tmux/scripts/reflow-grid.sh "#{window_id}"'

# Option+click a pane to view/edit a free-text description of what it's
# doing, via a native macOS dialog (real Cocoa text field -- reliable
# cursor movement, copy/paste, etc, no custom terminal-input code to
# maintain). Pre-filled with the existing description if there is one
# (empty otherwise), so the same action serves as both "write a new one"
# and "read/edit the existing one". Stored as a per-pane option, so it
# persists across reflows, resizes, and session save/restore.
bind-key -n M-MouseDown1Pane run-shell "~/.tmux/scripts/pane-desc-native.sh '#{pane_id}'"

# Shift+click 2 panes to select them (both highlighted yellow -- tmux's
# native pane mark only tracks one at a time, so selection is tracked
# separately per-pane and reflected live in the border style above),
# then Option+x swaps their positions -- a single atomic swap-pane call,
# instant, no flicker. The resulting arrangement is just part of the
# normal layout, so it's captured by the existing ~30s autosave/restore
# like anything else -- nothing extra needed to "remember" it for next
# time.
bind-key -n S-MouseDown1Pane run-shell "~/.tmux/scripts/pane-select-swap.sh '#{pane_id}'"
bind-key -n M-x run-shell '~/.tmux/scripts/pane-swap-execute.sh'

# A plain click (no shift) cancels any pending swap selection, like
# dismissing a selection by clicking away -- runs alongside the normal
# click behavior (focus the pane, forward click to mouse-aware programs).
bind-key -n MouseDown1Pane select-pane -t = \; send-keys -M \; run-shell '~/.tmux/scripts/pane-click-clear.sh'

# Reflow into the capped grid whenever a pane closes too (explicit kill,
# or the program inside it exiting on its own), so removal keeps the same
# 2-row/growing-column ordering and even sizing as adding does.
set-hook -g after-kill-pane 'run-shell "~/.tmux/scripts/reflow-safe.sh"'
set-hook -g pane-exited 'run-shell "~/.tmux/scripts/reflow-safe.sh"'

# Disable copy-mode character jumps (f/F/t/T and their repeat keys). Typing
# while scrolled back would otherwise leave a stuck "(jump to forward)"
# prompt at the bottom of the window.
unbind-key -T copy-mode f
unbind-key -T copy-mode F
unbind-key -T copy-mode t
unbind-key -T copy-mode T
unbind-key -T copy-mode \;
unbind-key -T copy-mode ,
unbind-key -T copy-mode-vi f
unbind-key -T copy-mode-vi F
unbind-key -T copy-mode-vi t
unbind-key -T copy-mode-vi T
unbind-key -T copy-mode-vi \;
unbind-key -T copy-mode-vi ,

# Initialize TPM (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
